<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Practical 32 - To Do List</title>

<style>
*{box-sizing:border-box}
body{
margin:0;font-family:Arial,Helvetica,sans-serif;color:white;min-height:100vh;
background:radial-gradient(circle at top left,#4f46e5,transparent 35%),
radial-gradient(circle at bottom right,#0891b2,transparent 35%),#020617;
}
.navbar{
height:70px;padding:0 8%;display:flex;align-items:center;
background:rgba(15,23,42,.75);backdrop-filter:blur(12px);
border-bottom:1px solid rgba(255,255,255,.1);
}
.logo{font-size:25px;font-weight:bold}.logo span{color:#38bdf8}
.container{
width:90%;max-width:700px;margin:50px auto;padding:40px;text-align:center;
background:rgba(255,255,255,.07);backdrop-filter:blur(15px);
border:1px solid rgba(255,255,255,.12);border-radius:20px;
}
.badge{
display:inline-block;padding:8px 15px;border:1px solid rgba(56,189,248,.4);
background:rgba(56,189,248,.08);color:#38bdf8;border-radius:20px;
}
h1{font-size:40px}.question{color:#94a3b8;font-size:18px}
input{
padding:12px;width:65%;border:none;border-radius:8px;font-size:16px;
}
button{
background:#0284c7;color:white;border:none;padding:12px 20px;
border-radius:10px;font-weight:bold;cursor:pointer;margin:5px;
}
button:hover{background:#0ea5e9}
ul{
list-style:none;padding:0;margin-top:25px;
}
li{
padding:12px;margin:8px 0;background:rgba(0,0,0,.25);
border-radius:8px;text-align:left;color:#38bdf8;
cursor:pointer;
}
</style>
</head>

<body>

<nav class="navbar">
<div class="logo">Code<span>Sphere</span></div>
</nav>

<div class="container">

<div class="badge">JavaScript Practical 32</div>

<h1>To-Do List</h1>

<p class="question">
Create a to-do list using JavaScript.
</p>

<input type="text" id="task" placeholder="Enter a task">

<button onclick="addTask()">Add</button>

<ul id="taskList"></ul>

</div>

<script>
function addTask() {

    let task = document.getElementById("task").value.trim();

    if (task === "") {
        return;
    }

    let li = document.createElement("li");

    li.innerHTML = task;

    li.onclick = function() {
        this.remove();
    };

    document.getElementById("taskList").appendChild(li);

    document.getElementById("task").value = "";
}
</script>

</body>
</html>
