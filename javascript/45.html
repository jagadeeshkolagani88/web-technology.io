
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Practical 45 - localStorage</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;color:white;min-height:100vh;
background:radial-gradient(circle at top left,#4f46e5,transparent 35%),
radial-gradient(circle at bottom right,#0891b2,transparent 35%),#020617}
.navbar{height:70px;padding:0 8%;display:flex;align-items:center;
background:rgba(15,23,42,.75);backdrop-filter:blur(12px);
border-bottom:1px solid rgba(255,255,255,.1)}
.logo{font-size:25px;font-weight:bold}.logo span{color:#38bdf8}
.container{width:90%;max-width:800px;margin:60px auto;padding:40px;text-align:center;
background:rgba(255,255,255,.07);backdrop-filter:blur(15px);
border:1px solid rgba(255,255,255,.12);border-radius:20px}
.badge{display:inline-block;padding:8px 15px;border:1px solid rgba(56,189,248,.4);
background:rgba(56,189,248,.08);color:#38bdf8;border-radius:20px}
h1{font-size:40px}.question{color:#94a3b8;font-size:18px}
input{
padding:12px;width:70%;max-width:400px;border:none;border-radius:8px;
font-size:16px;margin:15px;
}
button{background:#0284c7;color:white;border:none;padding:12px 20px;
border-radius:10px;font-weight:bold;cursor:pointer;margin:5px}
button:hover{background:#0ea5e9}
.output{margin-top:25px;padding:20px;background:rgba(0,0,0,.25);
border-radius:10px;color:#38bdf8;font-size:20px}
</style>
</head>

<body>

<nav class="navbar"><div class="logo">Code<span>Sphere</span></div></nav>

<div class="container">

<div class="badge">JavaScript Practical 45</div>

<h1>localStorage</h1>

<p class="question">
Store and retrieve data using localStorage.
</p>

<input type="text" id="data" placeholder="Enter data">

<br>

<button onclick="saveData()">Save</button>
<button onclick="getData()">Retrieve</button>
<button onclick="clearData()">Clear</button>

<div class="output" id="output">
Stored data will appear here
</div>

</div>

<script>
function saveData() {

    let data = document.getElementById("data").value;

    localStorage.setItem("myData", data);

    document.getElementById("output").innerHTML =
        "Data saved successfully.";
}

function getData() {

    let data = localStorage.getItem("myData");

    document.getElementById("output").innerHTML =
        data ? "Stored Data = " + data : "No data found.";
}

function clearData() {

    localStorage.removeItem("myData");

    document.getElementById("output").innerHTML =
        "Stored data cleared.";
}
</script>

</body>
</html>
