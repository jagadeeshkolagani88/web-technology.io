
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Practical 46 - Login Form</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
color:white;
min-height:100vh;
background:
radial-gradient(circle at top left,#4f46e5,transparent 35%),
radial-gradient(circle at bottom right,#0891b2,transparent 35%),
#020617;
}

.navbar{
height:70px;
padding:0 8%;
display:flex;
align-items:center;
background:rgba(15,23,42,.75);
backdrop-filter:blur(12px);
border-bottom:1px solid rgba(255,255,255,.1);
}

.logo{
font-size:25px;
font-weight:bold;
}

.logo span{
color:#38bdf8;
}

.container{
width:90%;
max-width:500px;
margin:70px auto;
padding:40px;
text-align:center;
background:rgba(255,255,255,.07);
backdrop-filter:blur(15px);
border:1px solid rgba(255,255,255,.12);
border-radius:20px;
}

.badge{
display:inline-block;
padding:8px 15px;
border:1px solid rgba(56,189,248,.4);
background:rgba(56,189,248,.08);
color:#38bdf8;
border-radius:20px;
}

h1{
font-size:40px;
}

.question{
color:#94a3b8;
font-size:18px;
line-height:1.7;
}

input{
display:block;
width:100%;
padding:13px;
margin:15px 0;
border:none;
border-radius:8px;
font-size:16px;
}

button{
background:#0284c7;
color:white;
border:none;
padding:12px 25px;
border-radius:10px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#0ea5e9;
}

.output{
margin-top:25px;
padding:20px;
background:rgba(0,0,0,.25);
border-radius:10px;
color:#38bdf8;
font-size:18px;
}

@media(max-width:600px){
.container{
padding:25px;
margin:40px auto;
}
h1{
font-size:32px;
}
}
</style>
</head>

<body>

<nav class="navbar">
<div class="logo">Code<span>Sphere</span></div>
</nav>

<div class="container">

<div class="badge">JavaScript Practical 46</div>

<h1>Login Form</h1>

<p class="question">
Create a responsive login form with JavaScript validation.
</p>

<input type="email" id="email" placeholder="Enter email">

<input type="password" id="password" placeholder="Enter password">

<button onclick="login()">Login</button>

<div class="output" id="output">
Enter your login details.
</div>

</div>

<script>
function login() {

    let email = document.getElementById("email").value.trim();
    let password = document.getElementById("password").value;

    let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if (email === "" || password === "") {

        document.getElementById("output").innerHTML =
            "Please enter email and password.";

    } else if (!emailPattern.test(email)) {

        document.getElementById("output").innerHTML =
            "Please enter a valid email address.";

    } else if (password.length < 6) {

        document.getElementById("output").innerHTML =
            "Password must contain at least 6 characters.";

    } else {

        document.getElementById("output").innerHTML =
            "Login validation successful!";
    }
}
</script>

</body>
</html>
