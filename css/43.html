<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeSphere - CSS Practical 43</title>
<style>

*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,Helvetica,sans-serif;min-height:100vh;color:white;background:radial-gradient(circle at top left,#4f46e5,transparent 35%),radial-gradient(circle at bottom right,#0891b2,transparent 35%),#020617}
nav{height:70px;padding:0 8%;display:flex;align-items:center;justify-content:space-between;background:rgba(15,23,42,.75);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.1)}
.logo{font-size:25px;font-weight:bold}.logo span{color:#38bdf8}
nav a{color:#cbd5e1;text-decoration:none;margin-left:25px;font-size:15px}nav a:hover{color:#38bdf8}
main{width:90%;max-width:900px;margin:60px auto 80px}
.badge{display:inline-block;padding:8px 18px;margin-bottom:22px;border:1px solid rgba(56,189,248,.4);border-radius:30px;color:#38bdf8;background:rgba(56,189,248,.08);font-size:14px}
h1{font-size:42px;margin-bottom:18px}h1 span{color:#38bdf8}
p{color:#94a3b8;line-height:1.7}
.card{margin-top:30px;padding:35px;border-radius:20px;background:rgba(255,255,255,.07);backdrop-filter:blur(15px);border:1px solid rgba(255,255,255,.12)}
.demo{margin-top:25px;padding:25px;border-radius:15px;background:rgba(56,189,248,.08);border:1px solid rgba(56,189,248,.2)}
button,.btn{display:inline-block;margin-top:15px;padding:12px 20px;background:#0284c7;color:white;border:0;border-radius:10px;text-decoration:none;font-weight:bold}
button:hover,.btn:hover{background:#0ea5e9}
input,select,textarea{padding:10px;margin:7px 0;border-radius:8px;border:1px solid #64748b;background:#0f172a;color:white}
.box{padding:25px;margin:10px;border-radius:12px;background:#0284c7}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.flex{display:flex;gap:15px;flex-wrap:wrap}
footer{text-align:center;padding:25px;border-top:1px solid rgba(255,255,255,.1);color:#94a3b8;background:rgba(2,6,23,.7)}
@media(max-width:700px){main{width:92%;margin-top:40px}h1{font-size:32px}.grid{grid-template-columns:1fr}.flex{flex-direction:column}}

.highlight{color:#38bdf8;font-weight:bold}
#special{color:#0ea5e9;font-weight:bold}
</style>
</head>
<body>
<nav>
    <div class="logo">Code<span>Sphere</span></div>
    <div><a href="index.html">CSS Programs</a><a href="../index.html">Home</a></div>
</nav>
<main>
    <div class="badge">CSS PRACTICAL 43</div>
    <h1>CSS <span>Practical 43</span></h1>
    <div class="card">
        <h2>Demonstrate CSS image filters.</h2>
        <div class="demo"><div class="box" style="filter:grayscale(100%)">Grayscale Filter</div></div>
    </div>
    <a href="index.html" class="btn">← Back to CSS Programs</a>
</main>
<footer>
    <strong>CodeSphere</strong><br>
    CSS Practical Programs
</footer>
</body>
</html>
