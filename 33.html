
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Practical 33 - Quiz</title>

<style>
*{box-sizing:border-box}
body{
margin:0;font-family:Arial,Helvetica,sans-serif;color:white;min-height:100vh;
background:radial-gradient(circle at top left,#4f46e5,transparent 35%),
radial-gradient(circle at bottom right,#0891b2,transparent 35%),#020617;
}
.navbar{
height:70px;padding:0 8%;display:flex;align-items:center;
background:rgba(15,23,42,.75);backdrop-filter:blur(12px);
border-bottom:1px solid rgba(255,255,255,.1);
}
.logo{font-size:25px;font-weight:bold}.logo span{color:#38bdf8}
.container{
width:90%;max-width:800px;margin:60px auto;padding:40px;
text-align:center;background:rgba(255,255,255,.07);
backdrop-filter:blur(15px);border:1px solid rgba(255,255,255,.12);
border-radius:20px;
}
.badge{
display:inline-block;padding:8px 15px;border:1px solid rgba(56,189,248,.4);
background:rgba(56,189,248,.08);color:#38bdf8;border-radius:20px;
}
h1{font-size:40px}.question{font-size:22px;color:#fff}
label{
display:block;margin:12px;padding:12px;background:rgba(0,0,0,.2);
border-radius:8px;text-align:left;
}
button{
background:#0284c7;color:white;border:none;padding:12px 25px;
border-radius:10px;font-weight:bold;cursor:pointer;margin-top:15px;
}
button:hover{background:#0ea5e9}
.output{
margin-top:25px;padding:20px;background:rgba(0,0,0,.25);
border-radius:10px;color:#38bdf8;font-size:20px;
}
</style>
</head>

<body>

<nav class="navbar">
<div class="logo">Code<span>Sphere</span></div>
</nav>

<div class="container">

<div class="badge">JavaScript Practical 33</div>

<h1>Quiz Application</h1>

<p class="question">What is the correct way to declare a variable in JavaScript?</p>

<label>
<input type="radio" name="answer" value="a">
var x = 10;
</label>

<label>
<input type="radio" name="answer" value="b">
variable x = 10;
</label>

<label>
<input type="radio" name="answer" value="c">
int x = 10;
</label>

<button onclick="checkAnswer()">Submit Answer</button>

<div class="output" id="output">
Select an answer.
</div>

</div>

<script>
function checkAnswer() {

    let answer = document.querySelector(
        'input[name="answer"]:checked'
    );

    if (!answer) {
        document.getElementById("output").innerHTML =
            "Please select an answer.";
        return;
    }

    if (answer.value === "a") {
        document.getElementById("output").innerHTML =
            "Correct Answer!";
    } else {
        document.getElementById("output").innerHTML =
            "Wrong Answer. Correct answer is var x = 10;";
    }
}
</script>

</body>
</html>
