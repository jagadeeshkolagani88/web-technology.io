
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practical 59 - Frequency of Elements</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            color: white;
            min-height: 100vh;

            background:
                radial-gradient(circle at top left, #4f46e5, transparent 35%),
                radial-gradient(circle at bottom right, #0891b2, transparent 35%),
                #020617;
        }

        .navbar {
            height: 70px;
            padding: 0 8%;
            display: flex;
            align-items: center;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .logo span {
            color: #38bdf8;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 70px auto;
            padding: 40px;
            text-align: center;

            background: rgba(255,255,255,0.07);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 20px;
        }

        .badge {
            display: inline-block;
            padding: 8px 15px;
            border: 1px solid rgba(56,189,248,0.4);
            background: rgba(56,189,248,0.08);
            color: #38bdf8;
            border-radius: 20px;
        }

        h1 {
            font-size: 40px;
        }

        .question {
            color: #94a3b8;
            line-height: 1.7;
        }

        input {
            padding: 12px;
            margin: 15px;
            width: 80%;
            max-width: 500px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            background: #0284c7;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0ea5e9;
        }

        .output {
            margin-top: 25px;
            padding: 20px;
            background: rgba(0,0,0,0.25);
            border-radius: 10px;
            color: #38bdf8;
            font-size: 20px;
            line-height: 1.8;
        }
    </style>
</head>

<body>

<nav class="navbar">
    <div class="logo">
        Code<span>Sphere</span>
    </div>
</nav>

<div class="container">

    <div class="badge">JavaScript Practical 59</div>

    <h1>Frequency of Each Element</h1>

    <p class="question">
        Write a program to find the frequency of each element in an array.
    </p>

    <input
        type="text"
        id="array"
        placeholder="Example: 1,2,2,3,3,3"
    >

    <br><br>

    <button onclick="findFrequency()">
        Find Frequency
    </button>

    <div class="output" id="output">
        Output will appear here
    </div>

</div>

<script>
    function findFrequency() {

        let input = document.getElementById("array").value;

        let numbers = input
            .split(",")
            .map(Number)
            .filter(number => !isNaN(number));

        let frequency = {};

        numbers.forEach(function(number) {

            if (frequency[number]) {
                frequency[number]++;
            } else {
                frequency[number] = 1;
            }

        });

        let result = "";

        for (let number in frequency) {
            result += number + " : " + frequency[number] + "<br>";
        }

        document.getElementById("output").innerHTML = result;
    }
</script>

</body>
</html>
